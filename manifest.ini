[ABOUT]
NAME = PaceCoach
AUTHOR = PaceCoach
VERSION = 0.3.0
DESCRIPTION = Co-driver and driving coach. Calls every corner, tells you when to brake, and explains your mistakes in plain language.

[CORE]
; PARTIAL: loads when a window is first opened, then stays loaded.
LAZY = PARTIAL

[RENDER_CALLBACKS]
; Draws the driving line on the track.
TRANSPARENT = draw3D

[WINDOW_...]
ID = main
NAME = PaceCoach
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 460, 260
MIN_SIZE = 300, 120
FLAGS = MAIN, NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = map
NAME = PaceCoach Map
ICON = icon.png
FUNCTION_MAIN = windowMap
SIZE = 280, 280
MIN_SIZE = 160, 160
FLAGS = NO_BACKGROUND, FLOATING_TITLE_BAR, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = panel
NAME = PaceCoach Panel
ICON = icon.png
FUNCTION_MAIN = windowPanel
SIZE = 560, 620
MIN_SIZE = 420, 320
